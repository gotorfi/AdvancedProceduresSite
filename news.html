<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>News</title>

    <link rel="icon" type="image/png" href="IMG/icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="CSS/variables.css">
    <link rel="stylesheet" href="CSS/layout.css">
    <link rel="stylesheet" href="CSS/components.css">
    <link rel="stylesheet" href="CSS/animations.css">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/responsive.css">
    <link rel="stylesheet" href="CSS/news.css">

</head>


<body>

<main>

    <section class="section">


        <!-- Back -->

        <a class="button-outline" href="index.html">
            ← Home
        </a>


        <div class="news-detail-header">


            <!-- Image -->

            <div class="news-detail-image-wrapper">

                <div
                    id="news-new"
                    class="news-detail-new"
                    style="display: none;">
                    NEW!
                </div>


                <img
                    id="news-image"
                    class="news-detail-image"
                    src=""
                    alt="">
                    
            </div>


            <!-- Header information -->

            <div class="news-detail-info">

                <span class="section-label">
                    NEWS
                </span>


                <h1 id="news-title"></h1>


                <p
                    class="news-detail-date"
                    id="news-date">
                </p>


                <p
                    class="news-detail-subtitle"
                    id="news-subtitle">
                </p>

            </div>

        </div>


        <div class="divider"></div>


        <!-- Article -->

        <div
            class="news-detail-content"
            id="news-content">

            <!-- Generated from news.json -->

        </div>


        <!-- Footer -->

        <div class="news-detail-footer">

            <span
                class="news-detail-footer-date"
                id="news-footer-date">
            </span>


            <a
                class="button-outline"
                href="index.html">

                ← Back to Home

            </a>

        </div>


    </section>


    <!-- Footer -->

    <footer class="site-footer">

        <div class="footer-avatar">

            <img src="IMG/profile.png" alt="GotorFI">

        </div>


        <div class="footer-info">

            <h3>Advanced Procedures</h3>

            <p>
                Advanced Procedures plugin created by GotorFI
                and made for MCreator created by Pylo.
            </p>

            <p>
                © 2026 GotorFI. All rights reserved.
            </p>

        </div>


        <div class="footer-links">

            <a
                href="https://mcreator.net/plugin/123957/release-advanced-procedures-gotorfi"
                target="_blank">

                MCreator Website

            </a>


            <a
                href="feedback.html"
                target="_blank">

                Feedback Form

            </a>

        </div>


        <div class="footer-logos">

            <img src="IMG/mcreator.png" alt="MCreator">

            <img src="IMG/icon.png" alt="Advanced Procedures">

        </div>

    </footer>

</main>


<script src="JS/news.js"></script>

</body>

</html>
